upstream app {
    server app:8080;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;

    # API + health → app
    location /api/ {
        proxy_pass         http://app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /health {
        access_log off;
        proxy_pass http://app;
    }

    # Static assets → frontend
    location /assets/     { proxy_pass http://frontend; }
    location = /favicon.svg { proxy_pass http://frontend; }

    # Known frontend routes → frontend container
    location = /          { proxy_pass http://frontend; }
    location /login       { proxy_pass http://frontend; }
    location /register    { proxy_pass http://frontend; }
    location /dashboard   { proxy_pass http://frontend; }
    location /stats       { proxy_pass http://frontend; }

    # Everything else is a short URL hash → app
    location / {
        proxy_pass         http://app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
